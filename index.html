<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TP - Asset Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;
  --border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.13);
  --text:#1a1917;--text2:#6b6a65;--text3:#9c9b96;--accent:#1a1917;
  --green:#15803d;--green-bg:#f0fdf4;--green-bd:#bbf7d0;
  --red:#b91c1c;--red-bg:#fef2f2;--red-bd:#fecaca;
  --amber:#b45309;--amber-bg:#fffbeb;--amber-bd:#fde68a;
  --blue:#1d4ed8;--blue-bg:#eff6ff;--blue-bd:#bfdbfe;
  --purple:#6d28d9;--purple-bg:#f5f3ff;--purple-bd:#ddd6fe;
  --r:10px;--rl:14px;--rs:6px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;position:sticky;top:0;z-index:50}
.hdr-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:58px;gap:1rem}
.hdr-l{display:flex;align-items:center;gap:10px}
.live{width:8px;height:8px;background:#22c55e;border-radius:50%;animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
.hdr-sub{font-size:12px;color:var(--text3);margin-top:1px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:inherit;transition:all .12s}
.btn:hover{background:var(--surface2);color:var(--text)}
.tabs-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem}
.tabs-in{max-width:1320px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{padding:12px 20px;font-size:13px;color:var(--text3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .12s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab:hover{color:var(--text2)}
.tab.on{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
.main{max-width:1320px;margin:0 auto;padding:1.75rem 2rem}
.sec{margin-bottom:2rem}
.sec-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1rem 1.1rem;transition:box-shadow .12s}
.kpi:hover{box-shadow:0 2px 14px rgba(0,0,0,.07)}
.kpi-lbl{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.kpi-val{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1}
.kpi-sub{font-size:12px;color:var(--text3);margin-top:4px}
.kpi.g{border-left:3px solid var(--green);background:var(--green-bg)}
.kpi.r{border-left:3px solid var(--red);background:var(--red-bg)}
.kpi.a{border-left:3px solid #f59e0b;background:var(--amber-bg)}
.kpi.b{border-left:3px solid #3b82f6;background:var(--blue-bg)}
.kpi.p{border-left:3px solid #8b5cf6;background:var(--purple-bg)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:860px){.cols2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.ph{padding:.85rem 1.1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.ph-title{font-size:13px;font-weight:500;color:var(--text2)}
.ph-cnt{font-size:12px;color:var(--text3);background:var(--surface2);padding:2px 8px;border-radius:20px;white-space:nowrap}
.toolbar{padding:.75rem 1.1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.srch{padding:7px 11px;border:1px solid var(--border2);border-radius:var(--rs);font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);flex:1;min-width:160px;max-width:260px}
.srch:focus{outline:none;border-color:#94a3b8;background:var(--surface)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--surface2)}
th{padding:9px 13px;text-align:left;font-weight:500;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:9px 13px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.tr{text-align:right;font-family:'DM Mono',monospace;font-size:12px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;margin:1px}
.bg{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.br{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.ba{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.bb{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
.bx{background:var(--surface2);color:var(--text2);border:1px solid var(--border2)}
.pag{display:flex;align-items:center;gap:8px;padding:.75rem 1.1rem;border-top:1px solid var(--border);font-size:12px;color:var(--text3)}
.pag span{flex:1}
.pb{padding:4px 11px;border-radius:6px;border:1px solid var(--border2);background:none;font-family:inherit;font-size:12px;color:var(--text2);cursor:pointer}
.pb:hover:not(:disabled){background:var(--surface2)}
.pb:disabled{opacity:.3;cursor:not-allowed}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:340px;gap:1rem;text-align:center;padding:2rem}
.spinner{width:34px;height:34px;border:2.5px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st{font-size:15px;font-weight:500}
.ss{font-size:13px;color:var(--text3);max-width:420px}
.div{height:1px;background:var(--border);margin:1.75rem 0}
.fade{animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.mt td{font-weight:600;background:var(--surface2)!important}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-in">
    <div class="hdr-l">
      <div class="live" id="ldot" style="display:none"></div>
      <div>
        <div class="hdr-title">TP - Asset Tracker</div>
        <div class="hdr-sub" id="hsub">A carregar...</div>
      </div>
    </div>
    <button class="btn" onclick="init()">↻ Actualizar</button>
  </div>
</div>
<div class="tabs-bar" id="tbar" style="display:none">
  <div class="tabs-in">
    <button class="tab on" id="t1" onclick="showTab('raw')">Overview</button>
    <button class="tab" id="t2" onclick="showTab('kpi')">RECOVERS KPI</button>
  </div>
</div>
<div class="main" id="app">
  <div class="state"><div class="spinner"></div><div class="st">A carregar dados</div><div class="ss">A ligar ao Google Sheets...</div></div>
</div>
<script>
const SUMMARY={"total_assets":90772,"wah_by_type":{"Active":{"Monitor":9339,"Desktop":162,"Diversos":2,"Portátil":2874,"MiniPC":4437,"Tablets":46,"Thin Client":288,"Docks":414,"Outros":405,"Posto de Trabalho":1,"Secretária":9,"Routers":95,"Cadeira":397,"Mesa de cafeteria":2},"Terminated":{"Monitor":809,"Desktop":24,"Diversos":1,"Portátil":85,"MiniPC":276,"Tablets":3,"Thin Client":26,"Docks":25,"Outros":67,"Secretária":3,"Cadeira":46},"Leave of Absence":{"Monitor":569,"Desktop":7,"Portátil":91,"MiniPC":278,"Tablets":1,"Thin Client":19,"Docks":24,"Secretária":1,"Cadeira":30,"Routers":1,"Outros":17},"Candidate":{"Monitor":194,"Portátil":13,"MiniPC":121}},"loc_by_type":{"WAHA":{"Monitor":11468,"Desktop":218,"Diversos":3,"Portátil":3083,"MiniPC":5277,"Tablets":51,"Thin Client":346,"Docks":466,"Outros":492,"Posto de Trabalho":1,"Secretária":13,"Routers":96,"Cadeira":477,"Mesa de cafeteria":2},"EDIFICIOS":{"Monitor":13121,"Desktop":417,"Diversos":39,"Portátil":1164,"MiniPC":7580,"Tablets":104,"Thin Client":820,"Docks":572,"Outros":92,"TV's (Wallboard)":398,"Armário":992,"Banco Corrido":86,"Bloco Gavetas":81,"Mesa de cafeteria":806,"Mesa":778,"Mobiliário":552,"Móvel Standard":36,"Posto de Trabalho":1035,"Secretária":3194,"Routers":68,"Cadeira":9858,"Cadeira de cafeteria":1093},"AVT":{"Monitor":601,"Desktop":3,"Diversos":92,"Portátil":210,"MiniPC":457,"Tablets":21,"Docks":121,"Outros":75,"TV's (Wallboard)":38,"Routers":121,"Banco Corrido":117,"Cadeira":64,"Mesa":92,"Armário":16,"Mesa de cafeteria":41},"WAREHOUSE":{"Monitor":795,"Diversos":20,"Portátil":154,"MiniPC":53,"Thin Client":59,"Docks":240,"Outros":85,"TV's (Wallboard)":1,"Armário":7,"Secretária":3,"Cadeira":2,"Mesa":1,"Desktop":6},"ARMAZÉM":{"Monitor":25,"Diversos":46,"Portátil":69,"MiniPC":1,"Docks":1,"Outros":13,"TV's (Wallboard)":5,"Armário":111,"Bloco Gavetas":13,"Mesa":141,"Mobiliário":154,"Posto de Trabalho":438,"Secretária":684,"Routers":2,"Cadeira":290,"Mesa de cafeteria":86,"Cadeira de cafeteria":6},"STAGING":{"Monitor":76,"Desktop":7,"Diversos":1,"Portátil":240,"MiniPC":841,"Tablets":1,"Thin Client":323,"Docks":2,"Bloco Gavetas":2,"Secretária":4,"Routers":2,"Cadeira":4,"Mesa de cafeteria":2,"Outros":2},"APARTAMENTOS":{"Diversos":1,"Outros":17,"Armário":2,"Bloco Gavetas":1,"Mesa":1,"Mobiliário":20,"Posto de Trabalho":17,"Secretária":59,"Routers":2868,"Cadeira":3972,"Monitor":2,"Mesa de cafeteria":68,"Cadeira de cafeteria":711}},"all_atypes":["Cadeira","Desktop","Diversos","Docks","Mesa de cafeteria","MiniPC","Monitor","Outros","Portátil","Posto de Trabalho","Routers","Secretária","Tablets","Thin Client"],"all_locs":["APARTAMENTOS","ARMAZÉM","AVT","EDIFICIOS","STAGING","WAHA","WAREHOUSE"],"term_with_retention":186,"term_without_retention":1179,"pc_lc":{"WAHA":{"Desktop":{"over3":216,"under3":0,"unk":2},"Portátil":{"over3":1912,"under3":363,"unk":808},"MiniPC":{"over3":4416,"under3":249,"unk":612},"Thin Client":{"over3":335,"under3":0,"unk":11}},"EDIFICIOS":{"Desktop":{"over3":405,"under3":3,"unk":9},"Portátil":{"over3":792,"under3":75,"unk":297},"MiniPC":{"over3":5316,"under3":357,"unk":1907},"Thin Client":{"over3":758,"under3":0,"unk":62}},"STAGING":{"Desktop":{"over3":5,"under3":0,"unk":2},"Portátil":{"over3":143,"under3":10,"unk":87},"MiniPC":{"over3":472,"under3":41,"unk":328},"Thin Client":{"over3":307,"under3":0,"unk":16}},"AVT":{"Desktop":{"over3":0,"under3":0,"unk":3},"Portátil":{"over3":110,"under3":6,"unk":94},"MiniPC":{"over3":323,"under3":21,"unk":113}},"WAREHOUSE":{"Portátil":{"over3":113,"under3":16,"unk":25},"MiniPC":{"over3":34,"under3":6,"unk":13},"Thin Client":{"over3":58,"under3":0,"unk":1},"Desktop":{"over3":0,"under3":6,"unk":0}},"ARMAZÉM":{"Portátil":{"over3":40,"under3":0,"unk":29},"MiniPC":{"over3":0,"under3":0,"unk":1}}},"waha_terminated":[{"bms":"5292863.0","name":"André Gomes","assets":["CNK02816H2"]},{"bms":"5485417.0","name":"Jorge Miguel Santos","assets":["CNK944226X"]},{"bms":"3727722.0","name":"Marcela Costa","assets":[]},{"bms":"5525834.0","name":"Kilyan Karramkan","assets":[]},{"bms":"1301696.0","name":"Luis Felix","assets":[]},{"bms":"6074984.0","name":"Stanley Antoine","assets":[]}]}};

const CSV_KPI='https://docs.google.com/spreadsheets/d/e/2PACX-1vQQsnuaNLwaEduAbGdNi6-VMzUwpECJ35jqsUR-nZiYd8R0S0QXYq25EH77oEM3amapspJ614SHxugf/pub?gid=622591588&single=true&output=csv';
let KPI=[],ts='',tp=0;
const PG=20;
let CI=null;

async function fetchCSV(url){
  const proxies=[u=>u,u=>'https://corsproxy.io/?'+encodeURIComponent(u),u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)];
  for(const p of proxies){try{const r=await fetch(p(url),{cache:'no-store'});if(r.ok){const t=await r.text();if(t.length>100&&t.includes(','))return t;}}catch(e){}}
  throw new Error('Erro');
}

function parseCSV(text){
  const rows=[];
  for(const line of text.split(/\r?\n/)){
    if(!line.trim())continue;
    const row=[];let i=0;
    while(i<line.length){
      if(line[i]==='"'){i++;let c='';while(i<line.length){if(line[i]==='"'&&line[i+1]==='"'){c+='"';i+=2;}else if(line[i]==='"'){i++;break;}else c+=line[i++];}row.push(c.trim());if(line[i]===',')i++;}
      else{let c='';while(i<line.length&&line[i]!==',')c+=line[i++];row.push(c.trim());if(line[i]===',')i++;}
    }
    rows.push(row);
  }
  return rows;
}

function toObj(rows){
  if(rows.length<2)return[];
  const h=rows[0];
  return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>{o[k]=r[i]||'';});return o;});
}

async function init(){
  document.getElementById('app').innerHTML='<div class="state"><div class="spinner"></div><div class="st">A carregar dados</div><div class="ss" id="ss-msg">A ligar ao Google Sheets...</div></div>';
  document.getElementById('tbar').style.display='none';
  document.getElementById('ldot').style.display='none';
  if(CI){try{CI.destroy();}catch(e){}CI=null;}
  try{
    document.getElementById('ss-msg').textContent='A carregar RECOVERS KPI...';
    const t=await fetchCSV(CSV_KPI);
    KPI=parseCSV(t);
  }catch(e){KPI=[];}
  document.getElementById('hsub').textContent='Dados consolidados · '+SUMMARY.total_assets.toLocaleString('pt-PT')+' assets';
  document.getElementById('ldot').style.display='block';
  document.getElementById('tbar').style.display='block';
  ts='';tp=0;
  showTab('raw');
}

function showTab(t){
  document.getElementById('t1').className='tab'+(t==='raw'?' on':'');
  document.getElementById('t2').className='tab'+(t==='kpi'?' on':'');
  if(t==='raw')renderOverview();else renderKPI();
}

function renderOverview(){
  const S=SUMMARY;
  const allTypes=S.all_atypes.slice().sort();
  const wahStatuses=Object.keys(S.wah_by_type).sort();
  const locKeys=Object.keys(S.loc_by_type).sort((a,b)=>{
    const ta=Object.values(S.loc_by_type[a]).reduce((s,v)=>s+v,0);
    const tb=Object.values(S.loc_by_type[b]).reduce((s,v)=>s+v,0);
    return tb-ta;
  });
  const locGrandTotal=locKeys.reduce((s,l)=>s+Object.values(S.loc_by_type[l]).reduce((ss,v)=>ss+v,0),0);
  const actTotal=wahStatuses.filter(k=>/active/i.test(k)).reduce((s,k)=>s+Object.values(S.wah_by_type[k]||{}).reduce((ss,v)=>ss+v,0),0);
  const termTotal=wahStatuses.filter(k=>/terminat/i.test(k)).reduce((s,k)=>s+Object.values(S.wah_by_type[k]||{}).reduce((ss,v)=>ss+v,0),0);
  const cov=S.term_with_retention+S.term_without_retention>0?Math.round(S.term_with_retention/(S.term_with_retention+S.term_without_retention)*100):0;
  const pcLocs=Object.keys(S.pc_lc).sort();
  const pcATSet=new Set();pcLocs.forEach(l=>Object.keys(S.pc_lc[l]).forEach(a=>pcATSet.add(a)));
  const pcATypes=[...pcATSet].sort();
  const pcTotal=pcLocs.reduce((s,l)=>s+pcATypes.reduce((ss,a)=>ss+(S.pc_lc[l][a]?S.pc_lc[l][a].over3+S.pc_lc[l][a].under3+S.pc_lc[l][a].unk:0),0),0);
  const tlist=S.waha_terminated.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const tf=tlist.filter(r=>!ts||r.bms.toLowerCase().includes(ts)||r.name.toLowerCase().includes(ts)||r.assets.some(a=>a.toLowerCase().includes(ts)));
  const tpaged=tf.slice(tp*PG,tp*PG+PG);
  const tpages=Math.ceil(tf.length/PG);
  const wahaAssets=tlist.reduce((s,r)=>s+r.assets.length,0);

  let h='<div class="fade">';

  h+=`<div class="sec"><div class="sec-lbl">1 · WAH Status ┄ Assets por Estado e Asset Type</div>
  <div class="kpi-row">
    <div class="kpi g"><div class="kpi-lbl">WAH Active</div><div class="kpi-val">${actTotal.toLocaleString('pt-PT')}</div></div>
    <div class="kpi r"><div class="kpi-lbl">WAH Terminated</div><div class="kpi-val">${termTotal.toLocaleString('pt-PT')}</div></div>
    <div class="kpi b"><div class="kpi-lbl">Total Geral</div><div class="kpi-val">${S.total_assets.toLocaleString('pt-PT')}</div></div>
  </div>
  <div class="panel"><div class="tw"><table><thead><tr><th>WAH Sdatus</th>`;
  allTypes.forEach(t=>{h+=`<th class="tr">${t}</th>`;});
  h+=`<th class="tr">Total</th></tr></thead><tbody>`;
  wahStatuses.forEach(wah=>{
    const cls=/active/i.test(wah)?'bg':/terminat/i.test(wah)?'br':'bx';
    const rowTot=allTypes.reduce((s,t)=>s+((S.wah_by_type[wah]||{})[t]||0),0);
    h+=`<tr><td><span class="badge ${cls}">${wah}</span></td>`;
    allTypes.forEach(t=>{h+=`<td class="tr">${(S.wah_by_type[wah]||{})[t]||0}</td>`;});
    h+=`<td class="tr" style="font-weight:600">${rowTot}</td></tr>`;
  });
  h+=`<tr style="background:var(--surface2);font-weight:600"><td>Total</td>`;
  allTypes.forEach(t=>{h+=`<td class="tr">${wahStatuses.reduce((s,w)=>s+((S.wah_by_type[w]||{})[t]||0),0)}</td>`;});
  h+=`<td class="tr">${S.total_assets}</td></tr></tbody></table></div></div></div><div class="div"></div>`;

  h+=`<div class="sec"><div class="sec-lbl">2 · Assets por Location Type e Asset Type</div>
  <div class="panel"><div class="tw"><table><thead><tr><th>Location Type</th>`;
  allTypes.forEach(t=>{h+=`<th class="tr">${t}</th>`;});
  h+=`<th class="tr">Total</th><th class="tr">%</th></tr></thead><tbody>`;
  locKeys.forEach(loc=>{
    const tot=Object.values(S.loc_by_type[loc]).reduce((s,v)=>s+v,0);
    h+=`<tr><td>${loc}</td>`;
    allTypes.forEach(t=>{h+=`<td class="tr">${(S.loc_by_type[loc]||{})[t]||0}</td>`;});
    h+=`<td class="tr" style="font-weight:600">${tot}</td><td class="tr">${((tot/locGrandTotal)*100).toFixed(1)}%</td></tr>`;
  });
  h+=`<tr style="background:var(--surface2);font-weight:600"><td>Total</td>`;
  allTypes.forEach(t=>{h+=`<td class="tr">${locKeys.reduce((s,l)=>s+((S.loc_by_type[l]||{})[t]||0),0)}</td>`;});
  h+=`<td class="tr">${locGrandTotal}</td><td class="tr">100%</td></tr></tbody></table></div></div></div><div class="div"></div>`;

  h+=`<div class="sec"><div class="sec-lbl">3 · WAH Terminated ┄ Retention Status</div>
  <div class="kpi-row">
    <div class="kpi r"><div class="kpi-lbl">Terminated Total</div><div class="kpi-val">${S.term_with_retention+S.term_without_retention).toLocaleString('pt-PT')}</div></div>
    <div class="kpi g"><div class="kpi-lbl">Com info</div><div class="kpi-val">${S.term_with_retention.toLocaleString('pt-PT')}</div></div>
    <div class="kpi a"><div class="kpi-lbl">Sem info / #N/A</div><div class="kpi-val">${S.term_without_retention.toLocaleString('pt-PT')}</div></div>
    <div class="kpi b"><div class="kpi-lbl">Taxa de Cobertura</div><div class="kpi-val">${cov}%</div></div>
  </div></div><div class="div"></div>`;

  h+=`<div class="sec"><div class="sec-lbl">4 · Lista WAHA + WAH Terminated</div>
  <div class="panel">
    <div class="toolbar">
      <span class="ph-title">WAHA Terminated</span>
      <span class="ph-cnt">${tf.length} pessoas · ${wahaAssets} assets</span>
      <input class="srch" placeholder="Filtrar BMS, nome ou asset..." value="${ts}" oninput="ts=this.value.toLowerCase();tp=0;renderOverview()">
    </div>
    <div class="tw"><table><thead><tr><th>BMS</th><th>Nome</th><th>Asset IDs</th><th class="tr">Nº Assets</th></tr></thead><tbody>`;
  tpaged.forEach(r=>{
    const ab=r.assets.map(a=>`<span class="badge bx">${a}</span>`).join(' ');
    h+=`<tr><td><span class="badge bb">${r.bms}</span></td><td>${r.name||'—'}</td><td style="max-width:500px;line-height:1.8">${ab||'—'}</td><td class="tr">${r.assets.length}</td></tr>`;
  });
  if(!tpaged.length)h+=`<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:1.5rem">Sem resultados</td></tr>`;
  h+=`</tbody></table></div>`;
  if(tpages>1)h+=`<div class="pag"><span>${tp*PG+1}–${Math.min(tp*PG+PG,tf.length)} de ${tf.length}</span>
    <button class="pb" onclick="tp--;renderOverview()" ${tp===0?'disabled':''}>← Ant</button>
    <button class="pb" onclick="tp++;renderOverview()" ${tp>=tpages-1?'disabled':''}>Seg →</button></div>`;
  h+=`</div></div><div class="div"></div>`;

  h+=`<div class="sec"><div class="sec-lbl">5 · PCs ┄ Life Cycle por Location Type e Asset Type</div>
  <div class="panel">
    <div class="ph"><span class="ph-title">PCs com localização válida</span><span class="ph-cnt">${pcTotal} assets</span></div>
    <div class="tw"><table><thead><tr><th rowspan="2">Location Type</th><th class="tr" rowspan="2">Total</th>`;
  pcATypes.forEach(a=>{h+=`<th class="tr" colspan="2" style="border-left:2px solid var(--border2)">${a}</th>`;});
  h+=`</tr><tr>`;
  pcATypes.forEach(()=>{h+=`<th class="tr" style="color:var(--green);border-left:2px solid var(--border2)">≤ 3a</th><th class="tr" style="color:var(--red)">&gt; 3a</th>`;});
  h+=`</tr></thead><tbody>`;
  pcLocs.forEach(l=>{
    const locTot=pcATypes.reduce((s,a)=>s+(S.pc_lc[l][a]?S.pc_lc[l][a].over3+S.pc_lc[l][a].under3+S.pc_lc[l][a].unk:0),0);
    if(!locTot)return;
    h+=`<tr><td>${l}</td><td class="tr" style="font-weight:600">${locTot}</td>`;
    pcATypes.forEach(a=>{
      const v=S.pc_lc[l][a]||{over3:0,under3:0,unk:0};
      const tot=v.over3+v.under3+v.unk;
      const u3P=tot?Math.round(v.under3/tot*100):0;
      const o3P=tot?Math.round(v.over3/tot*100):0;
      h+=`<td class="tr" style="color:var(--green);border-left:2px solid var(--border2)">${v.under3}<span style="color:var(--text3);font-size:10px"> (${u3P}%)</span></td>`;
      h+=`<td class="tr" style="color:var(--red)">${v.over3}<span style="color:var(--text3);font-size:10px"> (${o3P}%)</span></td>`;
    });
    h+=`</tr>`;
  });
  h+=`<tr style="background:var(--surface2);font-weight:600"><td>Total</td><td class="tr">${pcTotal}</td>`;
  pcATypes.forEach(a=>{
    const tU=pcLocs.reduce((s,l)=>s+(S.pc_lc[l][a]?S.pc_lc[l][a].under3:0),0);
    const tO=pcLocs.reduce((s,l)=>s+(S.pc_lc[l][a]?S.pc_lc[l][a].over3:0),0);
    const tA=pcLocs.reduce((s,l)=>s+(S.pc_lc[l][a]?S.pc_lc[l][a].over3+S.pc_lc[l][a].under3+S.pc_lc[l][a].unk:0),0);
    h+=`<td class="tr" style="color:var(--green);border-left:2px solid var(--border2)">${tU}<span style="font-weight:400;color:var(--text3);font-size:10px"> (${tA?Math.round(tU/tA*100):0}%)</span></td>`;
    h+=`<td class="tr" style="color:var(--red)">${tO}<span style="font-weight:400;color:var(--text3);font-size:10px"> (${tA?Math.round(tO/tA*100):0}%)</span></td>`;
  });
  h+=`</tr></tbody></table></div></div></div></div>`;
  document.getElementById('app').innerHTML=h;
}

function renderKPI(){
  if(KPI.length<2){document.getElementById('app').innerHTML='<div class="state"><div class="ss">Sem dados em RECOVERS KPI. Clica em Actualizar para carregar.</div></div>';return;}
  const H=KPI[0];
  const allData=toObj(KPI);
  function pN(v){if(!v&&v!==0)return 0;const s=String(v).replace(/[€\s]/g,'');const ci=s.lastIndexOf(',');const di=s.lastIndexOf('.');return parseFloat(ci>di?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,''))||0;}
  function fmtEur(v){return v.toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
  const mCol=H.find(h=>/m[eê]s|month/i.test(h))||H[0];
  const cResc=H.find(h=>/rescis/i.test(h))||'';
  const cEquip=H.find(h=>/equipam/i.test(h))||'';
  const cRec=H.find(h=>/recuperad/i.test(h))||'';
  const cProc=H.find(h=>/processo|em proc/i.test(h))||'';
  const cPct=H.find(h=>/percent|recupera.*%|%/i.test(h))||'';
  const cVal=H.find(h=>/valor|€|retid/i.test(h))||'';
  const data12=allData.filter(r=>(r[mCol]||'').trim());
  const dataW=data12.filter(r=>cResc&&pN(r[cResc])>0);
  const totResc=dataW.reduce((s,r)=>s+pN(r[cResc]),0);
  const totEquip=dataW.reduce((s,r)=>s+pN(r[cEquip]),0);
  const totRec=dataW.reduce((s,r)=>s+pN(r[cRec]),0);
  const totProc=dataW.reduce((s,r)=>s+pN(r[cProc]),0);
  const totVal=dataW.reduce((s,r)=>s+pN(r[cVal]),0);
  const avgPct=totEquip>0?(totRec/totEquip*100):0;
  let h='<div class="fade">';
  h+=`<div class="sec"><div class="sec-lbl">Totais Acumulados ${new Date().getFullYear()} — ${dataW.length} meses com dados</div>
  <div class="kpi-row">
    <div class="kpi b"><div class="kpi-lbl">Total Rescisões</div><div class="kpi-val">${totResc.toLocaleString('pt-PT')}</div></div>
    <div class="kpi p"><div class="kpi-lbl">Total Equipamentos</div><div class="kpi-val">${totEquip.toLocaleString('pt-PT')}</div></div>
    <div class="kpi g"><div class="kpi-lbl">Recuperados</div><div class="kpi-val">${totRec.toLocaleString('pt-PT')}</div></div>
    <div class="kpi a"><div class="kpi-lbl">Em Processo</div><div class="kpi-val">${totProc.toLocaleString('pt-PT')}</div></div>
    <div class="kpi ${avgPct>=80?'g':avgPct>=60?'a':'r'}"><div class="kpi-lbl">% Recuperação</div><div class="kpi-val">${avgPct.toFixed(0)}%</div></div>
    ${cVal?`<div class="kpi g"><div class="kpi-lbl">Valor Retido</div><div class="kpi-val" style="font-size:20px">${fmtEur(totVal)}</div></div>`:''}
  </div></div><div class="div"></div>`;
  const c1='ch1'+Date.now(),c2='ch2'+Date.now();
  h+=`<div class="sec"><div class="sec-lbl">Evolução Mensal</div>
  <div class="cols2">
    <div class="panel"><div class="ph"><span class="ph-title">Rescisões vs Recuperados vs Em Processo</span></div>
      <div style="padding:1rem;height:260px;position:relative"><canvas id="${c1}"></canvas></div></div>
    <div class="panel"><div class="ph"><span class="ph-title">Taxa de Recuperação (%)</span></div>
      <div style="padding:1rem;height:260px;position:relative"><canvas id="${c2}"></canvas></div></div>
  </div></div>`;
  setTimeout(()=>{
    if(CI){try{CI.destroy();}catch(e){}CI=null;}
    const labels=dataW.map(r=>(r[mCol]||'').replace(/^\d+\s*-\s*/,''));
    const ctx1=document.getElementById(c1);
    if(ctx1){CI=new Chart(ctx1,{type:'bar',data:{labels,datasets:[
      {label:'Rescisões',data:dataW.map(r=>pN(r[cResc])),backgroundColor:'rgba(47,117,181,.7)',borderRadius:3},
      {label:'Recuperados',data:dataW.map(r=>pN(r[cRec])),backgroundColor:'rgba(70,170,70,.7)',borderRadius:3},
      {label:'Em Processo',data:dataW.map(r=>pN(r[cProc])),backgroundColor:'rgba(240,178,60,.7)',borderRadius:3},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top'}},scales:{x:{grid:{display:false}},y:{grid:{color:'rgba(0,0,0,.04)'}}}}});}
    const ctx2=document.getElementById(c2);
    if(ctx2){const pd=dataW.map(r=>{const v=pN(r[cPct]);return v>1?v:v*100;});new Chart(ctx2,{type:'line',data:{labels,datasets:[{label:'%',data:pd,borderColor:'#3b82f6',backgroundColor:'#3b82f620',borderWidth:2,pointRadius:4,tension:.3,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{min:0,max:100,grid:{color:'rgba(0,0,0,.04)'},ticks:{callback:v=>v+'%'}}}}});}
  },80);
  h+=`<div class="div"></div><div class="sec"><div class="sec-lbl">Tabela Mensal Detalhada</div>
  <div class="panel"><div class="tw"><table><thead><tr><th>Mês</th>
    ${cResc?`<th class="tr">Total Rescisões</th>`:''}${cEquip?`<th class="tr">Total Equipamentos</th>`:''}
    ${cRec?`<th class="tr">Recuperados</th>`:''}${cProc?`<th class="tr">Em Processo</th>`:''}
    ${cPct?`<th class="tr">% Recuperação</th>`:''}${cVal?`<th class="tr">Valor Retido (€)</th>`:''}
  </tr></thead><tbody>`;
  data12.forEach(r=>{
    const mes=(r[mCol]||'').trim();if(!mes)return;
    const hasData=cResc&&pN(r[cResc])>0;
    const dim=hasData?'':' style="color:var(--text3)"';
    const dash='<span style="color:var(--text3)">—</span>';
    let pctHtml=dash;
    if(cPct&&r[cPct]){const pv=pN(r[cPct]);const pct=pv>1?pv:pv*100;if(pct>0){const cls=pct>=80?'bg':pct>=60?'ba':'br';pctHtml=`<span class="badge ${cls}">${pct.toFixed(0)}%</span>`;}}
    h+=`<tr${dim}><td><strong>${mes}</strong></td>
      ${cResc?`<td class="tr">${hasData?pN(r[cResc]).toLocaleString('pt-PT'):dash}</td>`:''}
      ${cEquip?`<td class="tr">${hasData?pN(r[cEquip]).toLocaleString('pt-PT'):dash}</td>`:''}
      ${cRec?`<td class="tr" style="${hasData?'color:var(--green);font-weight:500':'color:var(--text3)'}">${hasData?pN(r[cRec]).toLocaleString('pt-PT'):dash}</td>`:''}
      ${cProc?`<td class="tr" style="${hasData?'color:var(--amber)':'color:var(--text3)'}">${hasData?pN(r[cProc]).toLocaleString('pt-PT'):dash}</td>`:''}
      ${cPct?`<td class="tr">${pctHtml}</td>`:''}
      ${cVal?`<td class="tr" style="${hasData?'font-weight:500':'color:var(--text3)'}">${hasData?fmtEur(pN(r[cVal])):dash}</td>`:''}
    </tr>`;
  });
  h+=`<tr class="mt"><td>TOTAL / MÉDIA</td>
    ${cResc?`<td class="tr">${totResc.toLocaleString('pt-PT')}</td>`:''}
    ${cEquip?`<td class="tr">${totEquip.toLocaleString('pt-PT')}</td>`:''}
    ${cRec?`<td class="tr" style="color:var(--green)">${totRec.toLocaleString('pt-PT')}</td>`:''}
    ${cProc?`<td class="tr" style="color:var(--amber)">${totProc.toLocaleString('pt-PT')}</td>`:''}
    ${cPct?`<td class="tr"><span class="badge ${avgPct>=80?'bg':avgPct>=60?'ba':'br'}">${avgPct.toFixed(0)}%</span></td>`:''}
    ${cVal?`<td class="tr">${fmtEur(totVal)}</td>`:''}
  </tr></tbody></table></div></div></div></div>`;
  document.getElementById('app').innerHTML=h;
}

init();
</script>
</body>
</html>
