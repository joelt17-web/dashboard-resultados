<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TP - Asset Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;--surface3:#e8e7e1;
  --border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.13);
  --text:#1a1917;--text2:#6b6a65;--text3:#9c9b96;--accent:#1a1917;
  --green:#15803d;--green-bg:#f0fdf4;--green-bd:#bbf7d0;
  --red:#b91c1c;--red-bg:#fef2f2;--red-bd:#fecaca;
  --amber:#b45309;--amber-bg:#fffbeb;--amber-bd:#fde68a;
  --blue:#1d4ed8;--blue-bg:#eff6ff;--blue-bd:#bfdbfe;
  --purple:#6d28d9;--purple-bg:#f5f3ff;--purple-bd:#ddd6fe;
  --r:10px;--rl:14px;--rs:6px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;position:sticky;top:0;z-index:50}
.hdr-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:58px;gap:1rem}
.hdr-l{display:flex;align-items:center;gap:10px}
.live{width:8px;height:8px;background:#22c55e;border-radius:50%;animation:blink 2s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hdr-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
.hdr-sub{font-size:12px;color:var(--text3);margin-top:1px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:inherit;transition:all .12s}
.btn:hover{background:var(--surface2);color:var(--text)}
.btn-solid{background:var(--accent);color:#fff;border-color:var(--accent);padding:8px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit}
.btn-solid:hover{opacity:.82}
.tabs-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem}
.tabs-in{max-width:1320px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{padding:12px 20px;font-size:13px;color:var(--text3);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .12s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab:hover{color:var(--text2)}
.tab.on{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
.main{max-width:1320px;margin:0 auto;padding:1.75rem 2rem}
.sec{margin-bottom:2rem}
.sec-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1rem 1.1rem;transition:box-shadow .12s}
.kpi:hover{box-shadow:0 2px 14px rgba(0,0,0,.07)}
.kpi-lbl{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.kpi-val{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1}
.kpi-sub{font-size:12px;color:var(--text3);margin-top:4px}
.kpi.g{border-left:3px solid var(--green);background:var(--green-bg)}
.kpi.r{border-left:3px solid var(--red);background:var(--red-bg)}
.kpi.a{border-left:3px solid #f59e0b;background:var(--amber-bg)}
.kpi.b{border-left:3px solid #3b82f6;background:var(--blue-bg)}
.kpi.p{border-left:3px solid #8b5cf6;background:var(--purple-bg)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:860px){.cols2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}
.ph{padding:.85rem 1.1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.ph-title{font-size:13px;font-weight:500;color:var(--text2)}
.ph-cnt{font-size:12px;color:var(--text3);background:var(--surface2);padding:2px 8px;border-radius:20px;white-space:nowrap}
.toolbar{padding:.75rem 1.1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.srch{padding:7px 11px;border:1px solid var(--border2);border-radius:var(--rs);font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);flex:1;min-width:160px;max-width:260px}
.srch:focus{outline:none;border-color:#94a3b8;background:var(--surface)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--surface2)}
th{padding:9px 13px;text-align:left;font-weight:500;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:9px 13px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.tr{text-align:right;font-family:'DM Mono',monospace;font-size:12px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;margin:1px}
.bg{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.br{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.ba{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.bb{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
.bx{background:var(--surface2);color:var(--text2);border:1px solid var(--border2)}
.bp{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-bd)}
.pag{display:flex;align-items:center;gap:8px;padding:.75rem 1.1rem;border-top:1px solid var(--border);font-size:12px;color:var(--text3)}
.pag span{flex:1}
.pb{padding:4px 11px;border-radius:6px;border:1px solid var(--border2);background:none;font-family:inherit;font-size:12px;color:var(--text2);cursor:pointer}
.pb:hover:not(:disabled){background:var(--surface2)}
.pb:disabled{opacity:.3;cursor:not-allowed}
.prog-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.prog-row:last-child{border-bottom:none}
.prog-lbl{flex:0 0 130px;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-bar-w{flex:1;background:var(--surface2);border-radius:20px;height:7px;overflow:hidden}
.prog-bar{height:100%;border-radius:20px;background:#3b82f6;transition:width .4s}
.prog-v{flex:0 0 36px;font-size:12px;font-family:'DM Mono',monospace;text-align:right;color:var(--text2)}
.prog-p{flex:0 0 38px;font-size:11px;color:var(--text3);text-align:right}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:340px;gap:1rem;text-align:center;padding:2rem}
.spinner{width:34px;height:34px;border:2.5px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st{font-size:15px;font-weight:500}
.ss{font-size:13px;color:var(--text3);max-width:420px}
.div{height:1px;background:var(--border);margin:1.75rem 0}
.fade{animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.mt td{font-weight:600;background:var(--surface2)!important}
</style>
</head>

async function fetchCSV(url){
  // Try multiple proxies in sequence
  const proxies=[
    u=>u, // direct
    u=>'https://corsproxy.io/?'+encodeURIComponent(u),
    u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
    u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u),
  ];
  for(const proxy of proxies){
    try{
      const r=await fetch(proxy(url),{cache:'no-store'});
      if(r.ok){
        const t=await r.text();
        // validate: must have at least 2 lines and look like CSV
        if(t.length>200&&t.includes(',')&&t.split('\n').length>2)return t;
      }
    }catch(e){}
  }
  throw new Error('Não foi possível carregar os dados. Verifica a tua ligação à internet ou tenta mais tarde.');
}

function parseCSV(text){
  const rows=[];
  const lines=text.split(/\r?\n/);
  for(const line of lines){
    if(!line.trim())continue;
    const row=[];let i=0;
    while(i<line.length){
      if(line[i]==='"'){
        i++;let cell='';
        while(i<line.length){
          if(line[i]==='"'&&line[i+1]==='"'){cell+='"';i+=2;}
          else if(line[i]==='"'){i++;break;}
          else{cell+=line[i++];}
        }
        row.push(cell.trim());
        if(line[i]===',')i++;
      }else{
        let cell='';
        while(i<line.length&&line[i]!==',')cell+=line[i++];
        row.push(cell.trim());
        if(line[i]===',')i++;
      }
    }
    rows.push(row);
  }
  return rows;
}

function clean(v){
  if(v===null||v===undefined)return'';
  const s=String(v).trim();
  if(/^#(NAME|REF|N\/A|VALUE|DIV\/0|NULL|NUM)[\?!]?$/i.test(s)||s==='#N/A')return'';
  return s;
}

function cleanRows(rows){
  return rows.map(r=>r.map(clean));
}

function toObj(rows){
  if(rows.length<2)return[];
  const h=rows[0];
  return rows.slice(1).map(r=>{const o={};h.forEach((k,i)=>{o[k]=r[i]||'';});return o;});
}

function fc(headers,...terms){
  return headers.find(h=>terms.some(t=>h.toLowerCase().includes(t.toLowerCase())))||'';
}

    KPI=cleanRows(parseCSV(t2));

    const rawPromise=fetchCSV(CSV_RAW).then(t=>{RAW=cleanRows(parseCSV(t));});
    await Promise.race([rawPromise, new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),12000))]);
    if(RAW.length>2){usedLiveData=true;}
  }catch(e){
    // Live data failed — use embedded summary
    KPI=KPI.length>1?KPI:[];
  }
  
  setStatus("A calcular KPIs...");
  await new Promise(r=>setTimeout(r,10));
  
  const ts_label=usedLiveData
    ? `Tempo real · ${(RAW.length-1).toLocaleString("pt-PT")} registos · ${new Date().toLocaleTimeString("pt-PT")}`
    : `Dados consolidados · ${SUMMARY.total_assets.toLocaleString("pt-PT")} registos (actualiza ao abrir)`;
  
  document.getElementById("hsub").textContent=ts_label;
  document.getElementById("ldot").style.display="block";
  document.getElementById("tbar").style.display="block";
  ls="";lp=0;ts="";tp=0;ds="";dp=0;
  showTab("raw");
}

function showTab(t){
  document.getElementById('t1').className='tab'+(t==='raw'?' on':'');
  document.getElementById('t2').className='tab'+(t==='kpi'?' on':'');
  if(t==='raw')renderRaw(); else renderKPI();
}

// ══ RAW DATA ══
function renderRaw(){
  // Use SUMMARY embedded data if live RAW not available
  if(RAW.length<2){
    renderRawFromSummary();
    return;
  }
  const data=toObj(RAW);
  const H=RAW[0];
  const WAH  =fc(H,'WAH STATUS','WAH_STATUS','WAHSTATUS');
  const LOC  =fc(H,'LOCATION TY','LOCATION TYPE','LOCATION_TY');
  const RET  =fc(H,'RETENTION');
  const BMS  =fc(H,'BMS');
  const NAME =fc(H,'COLABNAME','COLAB NAME','NAME','COLABORADOR');
  const ATYPE=fc(H,'ASSET TYPE','ASSETTYPE','ASSET_TYPE');
  const LC   =fc(H,'LIFE CIC','LIFE CYCLE','LIFECYCLE','LIFE_CIC');
  const ASSET=fc(H,'SERIAL NUMBER','SERIAL','ASSET','ID');

  // Normaliza: trim + lowercase + NFC unicode
  function norm(s){
    if(!s)return'';
    return s.trim().toLowerCase()
      .replace(/[\u2018\u2019\u201A\u201B\u2032\u2035]/g,"'")
      .normalize('NFC');
  }

  // WHITELIST exacta — baseada nos valores reais do ficheiro Excel
  // Asset Types válidos (22 valores, lidos directamente do ficheiro)
  const VALID_ASSET_TYPES=new Set([
    'armário','banco corrido','bloco gavetas','cadeira','cadeira de cafeteria',
    'desktop','diversos','docks','mesa','mesa de cafeteria','minipc','mobiliário',
    'monitor','móvel standard','outros','portátil','posto de trabalho','routers',
    'secretária','tablets','thin client',"tv's (wallboard)"
  ]);
  // Location Types válidos (7 valores, lidos directamente do ficheiro)
  const VALID_LOC_TYPES=new Set([
    'apartamentos','armazém','avt','edificios','staging','waha','warehouse'
  ]);
  // WAH Status válidos (lidos directamente do ficheiro — exclui #N/A, #VALUE!, #ERROR!, #REF!)
  const VALID_WAH=new Set(['active','terminated','leave of absence','candidate']);

  function isValidAssetType(v){return!!v&&VALID_ASSET_TYPES.has(norm(v));}
  function isValidLocType(v){return!!v&&VALID_LOC_TYPES.has(norm(v));}
  function isValidWAH(v){return!!v&&VALID_WAH.has(norm(v));}

  // PC types para secção 5
  const PC_TYPES_SET=new Set(['thin client','portátil','minipc','desktop']);
  function isPCType(v){return PC_TYPES_SET.has(norm(v||''));}

  // Life Cycle: valores reais no ficheiro são exactamente 'mais 3 anos' e 'menos 3 anos'
  function normLC(v){return norm(v||'');}

  // Colecta todos os Asset Types válidos únicos
  const allTypes=[...new Set(data.map(r=>(r[ATYPE]||'').trim()).filter(isValidAssetType))].sort();

  // ── 1. WAH STATUS × ASSET TYPE (valid types only) ──
  const wahByType={};
  const wahTotals={};
  data.forEach(r=>{
    const wah=(r[WAH]||'').trim(); if(!isValidWAH(wah))return;
    const at=(r[ATYPE]||'').trim();
    if(!isValidAssetType(at))return;
    if(!wahByType[wah])wahByType[wah]={};
    wahByType[wah][at]=(wahByType[wah][at]||0)+1;
    wahTotals[wah]=(wahTotals[wah]||0)+1;
  });
  const wahStatuses=Object.keys(wahByType).sort();
  const actTotal=wahStatuses.filter(k=>/active/i.test(k)).reduce((s,k)=>s+(wahTotals[k]||0),0);
  const termTotal=wahStatuses.filter(k=>/terminat/i.test(k)).reduce((s,k)=>s+(wahTotals[k]||0),0);

  // ── 2. LOCATION TYPE × ASSET TYPE (valid types only) ──
  const locByType={};
  const locTotals={};
  data.forEach(r=>{
    const loc=(r[LOC]||'').trim();
    const at=(r[ATYPE]||'').trim();
    if(!isValidLocType(loc)||!isValidAssetType(at))return;
    if(!locByType[loc])locByType[loc]={};
    locByType[loc][at]=(locByType[loc][at]||0)+1;
    locTotals[loc]=(locTotals[loc]||0)+1;
  });
  const locKeys=Object.keys(locByType).sort((a,b)=>locTotals[b]-locTotals[a]);
  const locGrandTotal=Object.values(locTotals).reduce((s,v)=>s+v,0);

  // ── 3. TERMINATED + RETENTION ──
  const term=data.filter(r=>norm(r[WAH]||'')==='terminated');
  const withInfo=term.filter(r=>{const v=(r[RET]||'').trim();return v&&!v.startsWith('#');});
  const noInfo  =term.filter(r=>{const v=(r[RET]||'').trim();return!v||v.startsWith('#');});

  // ── 4. WAHA + Terminated list ──
  const wahaTerminated=data.filter(r=>norm(r[LOC]||'')==='waha'&&norm(r[WAH]||'')==='terminated');
  const tmap={};
  wahaTerminated.forEach(r=>{
    const bms=(r[BMS]||'').trim()||'—';
    const name=(r[NAME]||'').trim()||'—';
    const asset=(r[ASSET]||'').trim();
    const key=bms+'|||'+name;
    if(!tmap[key])tmap[key]={bms,name,assets:[]};
    if(asset&&!tmap[key].assets.includes(asset))tmap[key].assets.push(asset);
  });
  const tlist=Object.values(tmap).sort((a,b)=>a.name.localeCompare(b.name));
  const totalWahaAssets=wahaTerminated.length;

  // ── 5. PC ASSETS × LOCATION TYPE × ASSET TYPE × LIFE CYCLE ──
  const pcData=data.filter(r=>isPCType((r[ATYPE]||'').trim()));
  const pcLocTypes=[...new Set(pcData.map(r=>(r[LOC]||'').trim()).filter(isValidLocType))].sort();
  const pcATypes=[...new Set(pcData.map(r=>(r[ATYPE]||'').trim()).filter(isValidAssetType))].sort();
  // dmap: { locType: { assetType: { over3, under3, unk } } }
  const dmap={};
  pcLocTypes.forEach(l=>{dmap[l]={};pcATypes.forEach(a=>{dmap[l][a]={over3:0,under3:0,unk:0};});});
  pcData.forEach(r=>{
    const loc=(r[LOC]||'').trim();
    const at=(r[ATYPE]||'').trim();
    if(!isValidLocType(loc)||!isValidAssetType(at))return;
    const lc=norm(r[LC]||'');
    if(lc==='mais 3 anos')dmap[loc][at].over3++;
    else if(lc==='menos 3 anos')dmap[loc][at].under3++;
    else dmap[loc][at].unk++;
  });
  const pcLocTotal=pcLocTypes.reduce((s,l)=>s+pcATypes.reduce((ss,a)=>ss+dmap[l][a].over3+dmap[l][a].under3+dmap[l][a].unk,0),0);

  // ════ RENDER ════
  let h='<div class="fade">';

  // ── 1. WAH STATUS × ASSET TYPE ──
  h+=`<div class="sec"><div class="sec-lbl">1 · WAH Status — Assets por Estado e Asset Type</div>
  <div class="kpi-row">
    <div class="kpi g"><div class="kpi-lbl">WAH Active</div><div class="kpi-val">${actTotal}</div><div class="kpi-sub">assets activos</div></div>
    <div class="kpi r"><div class="kpi-lbl">WAH Terminated</div><div class="kpi-val">${termTotal}</div><div class="kpi-sub">assets terminados</div></div>
    <div class="kpi b"><div class="kpi-lbl">Total Geral</div><div class="kpi-val">${data.length}</div><div class="kpi-sub">todos os assets</div></div>
  </div>
  <div class="panel"><div class="tw"><table>
  <thead><tr><th>WAH Status</th>`;
  allTypes.forEach(t=>{ h+=`<th class="tr">${t}</th>`; });
  h+=`<th class="tr">Total</th></tr></thead><tbody>`;
  wahStatuses.forEach(wah=>{
    const cls=/active/i.test(wah)?'bg':/terminat/i.test(wah)?'br':'bx';
    h+=`<tr><td><span class="badge ${cls}">${wah}</span></td>`;
    allTypes.forEach(t=>{ h+=`<td class="tr">${wahByType[wah][t]||0}</td>`; });
    h+=`<td class="tr" style="font-weight:600">${wahTotals[wah]}</td></tr>`;
  });
  // Totals row
  h+=`<tr style="background:var(--surface2);font-weight:600"><td>Total</td>`;
  allTypes.forEach(t=>{
    const tot=wahStatuses.reduce((s,w)=>s+(wahByType[w][t]||0),0);
    h+=`<td class="tr">${tot}</td>`;
  });
  h+=`<td class="tr">${data.length}</td></tr>`;
  h+=`</tbody></table></div></div></div><div class="div"></div>`;

  // ── 2. LOCATION TYPE × ASSET TYPE ──
  h+=`<div class="sec"><div class="sec-lbl">2 · Assets por Location Type e Asset Type</div>
  <div class="panel"><div class="tw"><table>
  <thead><tr><th>Location Type</th>`;
  allTypes.forEach(t=>{ h+=`<th class="tr">${t}</th>`; });
  h+=`<th class="tr">Total</th><th class="tr">%</th></tr></thead><tbody>`;
  locKeys.forEach(loc=>{
    const tot=locTotals[loc];
    const pct=((tot/locGrandTotal)*100).toFixed(1);
    h+=`<tr><td>${loc}</td>`;
    allTypes.forEach(t=>{ h+=`<td class="tr">${locByType[loc][t]||0}</td>`; });
    h+=`<td class="tr" style="font-weight:600">${tot}</td><td class="tr">${pct}%</td></tr>`;
  });
  // Totals row
  h+=`<tr style="background:var(--surface2);font-weight:600"><td>Total</td>`;
  allTypes.forEach(t=>{
    const tot=locKeys.reduce((s,l)=>s+(locByType[l][t]||0),0);
    h+=`<td class="tr">${tot}</td>`;
  });
  h+=`<td class="tr">${locGrandTotal}</td><td class="tr">100%</td></tr>`;
  h+=`</tbody></table></div></div></div><div class="div"></div>`;

  // ── 3. RETENTION ──
  const cov=termTotal?((withInfo.length/termTotal)*100).toFixed(0):0;
  h+=`<div class="sec"><div class="sec-lbl">3 · WAH Terminated — Retention Status (Acompanhamento)</div>
  <div class="kpi-row">
    <div class="kpi r"><div class="kpi-lbl">Terminated Total</div><div class="kpi-val">${termTotal}</div><div class="kpi-sub">assets terminados</div></div>
    <div class="kpi g"><div class="kpi-lbl">Com info / Seguidos</div><div class="kpi-val">${withInfo.length}</div><div class="kpi-sub">retention preenchido</div></div>
    <div class="kpi a"><div class="kpi-lbl">Sem info / #N/A</div><div class="kpi-val">${noInfo.length}</div><div class="kpi-sub">necessitam acompanhamento</div></div>
    <div class="kpi b"><div class="kpi-lbl">Taxa de Cobertura</div><div class="kpi-val">${cov}%</div><div class="kpi-sub">terminados com info</div></div>
  </div></div><div class="div"></div>`;

  // ── 4. WAHA + TERMINATED LIST ──
  const tf=tlist.filter(r=>!ts||r.bms.toLowerCase().includes(ts)||r.name.toLowerCase().includes(ts)||r.assets.some(a=>a.toLowerCase().includes(ts)));
  const tpaged=tf.slice(tp*PG,tp*PG+PG);
  const tpages=Math.ceil(tf.length/PG);
  h+=`<div class="sec"><div class="sec-lbl">4 · Lista WAHA + WAH Terminated — BMS, Nome e Assets</div>
  <div class="panel">
    <div class="toolbar">
      <span class="ph-title">WAHA Terminated</span>
      <span class="ph-cnt">${tf.length} pessoas · ${totalWahaAssets} assets</span>
      <input class="srch" placeholder="Filtrar BMS, nome ou asset..." value="${ts}" oninput="ts=this.value.toLowerCase();tp=0;renderRaw()">
    </div>
    <div class="tw"><table><thead><tr><th>BMS</th><th>Nome</th><th>Asset IDs</th><th class="tr">Nº Assets</th></tr></thead><tbody>`;
  tpaged.forEach(r=>{
    const ab=r.assets.map(a=>`<span class="badge bx">${a}</span>`).join(' ');
    h+=`<tr><td><span class="badge bb">${r.bms}</span></td><td>${r.name}</td><td style="max-width:500px;line-height:1.8">${ab||'—'}</td><td class="tr">${r.assets.length}</td></tr>`;
  });
  if(!tpaged.length)h+=`<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:1.5rem">Sem resultados</td></tr>`;
  h+=`</tbody></table></div>`;
  if(tpages>1)h+=`<div class="pag"><span>${tp*PG+1}–${Math.min(tp*PG+PG,tf.length)} de ${tf.length} pessoas</span>
    <button class="pb" onclick="tp--;renderRaw()" ${tp===0?'disabled':''}>← Ant</button>
    <button class="pb" onclick="tp++;renderRaw()" ${tp>=tpages-1?'disabled':''}>Seg →</button></div>`;
  h+=`</div></div><div class="div"></div>`;

  // ── 5. PC ASSETS × LOCATION TYPE × ASSET TYPE × LIFE CYCLE ──
  // Colunas: para cada Asset Type → ≤3 anos | >3 anos
  const colSpan=pcATypes.length*2;
  h+=`<div class="sec"><div class="sec-lbl">5 · PCs — Life Cycle por Location Type e Asset Type</div>
  <div class="panel">
    <div class="ph"><span class="ph-title">PCs com localização válida</span><span class="ph-cnt">${pcLocTotal} assets</span></div>
    <div class="tw"><table><thead>
    <tr>
      <th rowspan="2">Location Type</th>
      <th class="tr" rowspan="2">Total</th>`;
  pcATypes.forEach(a=>{
    h+=`<th class="tr" colspan="2" style="border-left:2px solid var(--border2)">${a}</th>`;
  });
  h+=`</tr><tr>`;
  pcATypes.forEach(()=>{
    h+=`<th class="tr" style="color:var(--green);border-left:2px solid var(--border2)">≤ 3a</th><th class="tr" style="color:var(--red)">&gt; 3a</th>`;
  });
  h+=`</tr></thead><tbody>`;
  pcLocTypes.forEach(l=>{
    const locTot=pcATypes.reduce((s,a)=>s+dmap[l][a].over3+dmap[l][a].under3+dmap[l][a].unk,0);
    if(!locTot)return;
    h+=`<tr><td>${l}</td><td class="tr" style="font-weight:600">${locTot}</td>`;
    pcATypes.forEach(a=>{
      const v=dmap[l][a];
      const tot=v.over3+v.under3+v.unk;
      const u3P=tot?Math.round(v.under3/tot*100):0;
      const o3P=tot?Math.round(v.over3/tot*100):0;
      h+=`<td class="tr" style="color:var(--green);border-left:2px solid var(--border2)">${v.under3}<span style="color:var(--text3);font-size:10px"> (${u3P}%)</span></td>`;
      h+=`<td class="tr" style="color:var(--red)">${v.over3}<span style="color:var(--text3);font-size:10px"> (${o3P}%)</span></td>`;
    });
    h+=`</tr>`;
  });
  // Totals row
  const totLocTotal=pcLocTotal;
  h+=`<tr style="background:var(--surface2);font-weight:600"><td>Total</td><td class="tr">${totLocTotal}</td>`;
  pcATypes.forEach(a=>{
    const totU=pcLocTypes.reduce((s,l)=>s+dmap[l][a].under3,0);
    const totO=pcLocTypes.reduce((s,l)=>s+dmap[l][a].over3,0);
    const atTot=pcLocTypes.reduce((s,l)=>s+dmap[l][a].over3+dmap[l][a].under3+dmap[l][a].unk,0);
    const uP=atTot?Math.round(totU/atTot*100):0;
    const oP=atTot?Math.round(totO/atTot*100):0;
    h+=`<td class="tr" style="color:var(--green);border-left:2px solid var(--border2)">${totU}<span style="font-weight:400;color:var(--text3);font-size:10px"> (${uP}%)</span></td>`;
    h+=`<td class="tr" style="color:var(--red)">${totO}<span style="font-weight:400;color:var(--text3);font-size:10px"> (${oP}%)</span></td>`;
  });
  h+=`</tr>`;
  if(!pcLocTypes.length)h+=`<tr><td colspan="${colSpan+2}" style="text-align:center;color:var(--text3);padding:1.5rem">Sem assets de tipo PC encontrados.</td></tr>`;
  h+=`</tbody></table></div></div></div></div>`;

  document.getElementById('app').innerHTML=h;
}

function renderRawFromSummary(){
  const S=SUMMARY;

  const allLocs=S.all_locs.sort();
  const wahStatuses=Object.keys(S.wah_by_type).sort();

    const ta=Object.values(S.loc_by_type[a]).reduce((s,v)=>s+v,0);
    const tb=Object.values(S.loc_by_type[b]).reduce((s,v)=>s+v,0);
    return tb-ta;
  });
  const locGrandTotal=locKeys.reduce((s,l)=>s+Object.values(S.loc_by_type[l]).reduce((ss,v)=>ss+v,0),0);
  const actTotal=wahStatuses.filter(k=>/active/i.test(k)).reduce((s,k)=>s+(Object.values(S.wah_by_type[k]||{}).reduce((ss,v)=>ss+v,0)),0);
  const termTotal=wahStatuses.filter(k=>/terminat/i.test(k)).reduce((s,k)=>s+(Object.values(S.wah_by_type[k]||{}).reduce((ss,v)=>ss+v,0)),0);
  const cov=termTotal?((S.term_with_retention/(S.term_with_retention+S.term_without_retention))*100).toFixed(0):0;

  // PC data from SUMMARY
  const pcLocs=Object.keys(S.pc_lc).sort();
  const pcATypesSet=new Set();
  pcLocs.forEach(l=>Object.keys(S.pc_lc[l]).forEach(a=>pcATypesSet.add(a)));
  const pcATypes=[...pcATypesSet].sort();
  const pcLocTotal=pcLocs.reduce((s,l)=>s+pcATypes.reduce((ss,a)=>ss+(S.pc_lc[l][a]?S.pc_lc[l][a].over3+S.pc_lc[l][a].under3+S.pc_lc[l][a].unk:0),0),0);

  const tpages=Math.ceil(tf.length/PG);
  const totalWahaAssets=tlist.reduce((s,r)=>s+r.assets.length,0);

  let h='<div class="fade">';

  // 1. WAH STATUS
  h+=`<div class="sec"><div class="sec-lbl">1 · WAH Status — Assets por Estado e Asset Type</div>
  <div class="kpi-row">
    <div class="kpi g"><div class="kpi-lbl">WAH Active</div><div class="kpi-val">${actTotal}</div><div class="kpi-sub">assets activos</div></div>
    <div class="kpi r"><div class="kpi-lbl">WAH Terminated</div><div class="kpi-val">${termTotal}</div><div class="kpi-sub">assets terminados</div></div>
    <div class="kpi b"><div class="kpi-lbl">Total Geral</div><div class="kpi-val">${S.total_assets}</div><div class="kpi-sub">todos os assets</div></div>
  </div>
  <div class="panel"><div class="tw"><table>
  <thead><tr><th>WAH Status</th>`;
  allTypes.forEach(t=>{ h+=`<th class="tr">${t}</th>`; });
  h+=`<th class="tr">Total</th></tr></thead><tbody>`;
  wahStatuses.forEach(wah=>{
    const cls=/active/i.test(wah)?'bg':/terminat/i.test(wah)?'br':'bx';
    const rowTotal=allTypes.reduce((s,t)=>s+((S.wah_by_type[wah]||{})[t]||0),0);
    h+=`<tr><td><span class="badge ${cls}">${wah}</span></td>`;
    allTypes.forEach(t=>{ h+=`<td class="tr">${(S.wah_by_type[wah]||{})[t]||0}</td>`; });

  <div class="panel"><div class="tw"><table>
  <thead><tr><th>Location Type</th>`;
  allTypes.forEach(t=>{ h+=`<th class="tr">${t}</th>`; });
  h+=`<th class="tr">Total</th><th class="tr">%</th></tr></thead><tbody>`;
  locKeys.forEach(loc=>{
    const tot=Object.values(S.loc_by_type[loc]).reduce((s,v)=>s+v,0);
    const pct=((tot/locGrandTotal)*100).toFixed(1);
    h+=`<tr><td>${loc}</td>`;
    allTypes.forEach(t=>{ h+=`<td class="tr">${(S.loc_by_type[loc]||{})[t]||0}</td>`; });

  h+=`<td class="tr">${locGrandTotal}</td><td class="tr">100%</td></tr>`;
  h+=`</tbody></table></div></div></div><div class="div"></div>`;

  // 3. RETENTION
  h+=`<div class="sec"><div class="sec-lbl">3 · WAH Terminated — Retention Status</div>
  <div class="kpi-row">
    <div class="kpi r"><div class="kpi-lbl">Terminated Total</div><div class="kpi-val">${S.term_with_retention+S.term_without_retention}</div></div>
    <div class="kpi g"><div class="kpi-lbl">Com info</div><div class="kpi-val">${S.term_with_retention}</div></div>
    <div class="kpi a"><div class="kpi-lbl">Sem info / #N/A</div><div class="kpi-val">${S.term_without_retention}</div></div>
    <div class="kpi b"><div class="kpi-lbl">Taxa de Cobertura</div><div class="kpi-val">${cov}%</div></div>
  </div></div><div class="div"></div>`;

  // 4. WAHA TERMINATED LIST
  h+=`<div class="sec"><div class="sec-lbl">4 · Lista WAHA + WAH Terminated</div>
  <div class="panel">
    <div class="toolbar">
      <span class="ph-title">WAHA Terminated</span>
      <span class="ph-cnt">${tf.length} pessoas · ${totalWahaAssets} assets</span>
      <input class="srch" placeholder="Filtrar BMS, nome ou asset..." value="${ts}" oninput="ts=this.value.toLowerCase();tp=0;renderRaw()">
    </div>
    <div class="tw"><table><thead><tr><th>BMS</th><th>Nome</th><th>Asset IDs</th><th class="tr">Nº Assets</th></tr></thead><tbody>`;
  tpaged.forEach(r=>{
    const ab=r.assets.map(a=>`<span class="badge bx">${a}</span>`).join(' ');
    h+=`<tr><td><span class="badge bb">${r.bms}</span></td><td>${r.name}</td><td style="max-width:500px;line-height:1.8">${ab||'—'}</td><td class="tr">${r.assets.length}</td></tr>`;
  });
  if(!tpaged.length) h+=`<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:1.5rem">Sem resultados</td></tr>`;
  h+=`</tbody></table></div>`;
  if(tpages>1) h+=`<div class="pag"><span>${tp*PG+1}–${Math.min(tp*PG+PG,tf.length)} de ${tf.length}</span>
    <button class="pb" onclick="tp--;renderRaw()" ${tp===0?'disabled':''}>← Ant</button>
    <button class="pb" onclick="tp++;renderRaw()" ${tp>=tpages-1?'disabled':''}>Seg →</button></div>`;
  h+=`</div></div><div class="div"></div>`;

  // 5. PC × LOC × LC
  const colSpan=pcATypes.length*2;
  h+=`<div class="sec"><div class="sec-lbl">5 · PCs — Life Cycle por Location Type e Asset Type</div>
  <div class="panel">
    <div class="ph"><span class="ph-title">PCs com localização válida</span><span class="ph-cnt">${pcLocTotal} assets</span></div>
    <div class="tw"><table><thead>
    <tr><th rowspan="2">Location Type</th><th class="tr" rowspan="2">Total</th>`;
  pcATypes.forEach(a=>{ h+=`<th class="tr" colspan="2" style="border-left:2px solid var(--border2)">${a}</th>`; });
  h+=`</tr><tr>`;
  pcATypes.forEach(()=>{ h+=`<th class="tr" style="color:var(--green);border-left:2px solid var(--border2)">≤ 3a</th><th class="tr" style="color:var(--red)">&gt; 3a</th>`; });
  h+=`</tr></thead><tbody>`;
  pcLocs.forEach(l=>{
    const locTot=pcATypes.reduce((s,a)=>s+(S.pc_lc[l][a]?S.pc_lc[l][a].over3+S.pc_lc[l][a].under3+S.pc_lc[l][a].unk:0),0);
    if(!locTot)return;
    h+=`<tr><td>${l}</td><td class="tr" style="font-weight:600">${locTot}</td>`;
    pcATypes.forEach(a=>{
      const v=S.pc_lc[l][a]||{over3:0,under3:0,unk:0};
      const tot=v.over3+v.under3+v.unk;
      const u3P=tot?Math.round(v.under3/tot*100):0;
      const o3P=tot?Math.round(v.over3/tot*100):0;
      h+=`<td class="tr" style="color:var(--green);border-left:2px solid var(--border2)">${v.under3}<span style="color:var(--text3);font-size:10px"> (${u3P}%)</span></td>`;
      h+=`<td class="tr" style="color:var(--red)">${v.over3}<span style="color:var(--text3);font-size:10px"> (${o3P}%)</span></td>`;
    });
    h+=`</tr>`;
  });
  h+=`<tr style="background:var(--surface2);font-weight:600"><td>Total</td><td class="tr">${pcLocTotal}</td>`;
  pcATypes.forEach(a=>{
    const totU=pcLocs.reduce((s,l)=>s+(S.pc_lc[l][a]?S.pc_lc[l][a].under3:0),0);
    const totO=pcLocs.reduce((s,l)=>s+(S.pc_lc[l][a]?S.pc_lc[l][a].over3:0),0);
    const atTot=pcLocs.reduce((s,l)=>s+(S.pc_lc[l][a]?S.pc_lc[l][a].over3+S.pc_lc[l][a].under3+S.pc_lc[l][a].unk:0),0);
    const uP=atTot?Math.round(totU/atTot*100):0;
    const oP=atTot?Math.round(totO/atTot*100):0;
    h+=`<td class="tr" style="color:var(--green);border-left:2px solid var(--border2)">${totU}<span style="font-weight:400;color:var(--text3);font-size:10px"> (${uP}%)</span></td>`;
    h+=`<td class="tr" style="color:var(--red)">${totO}<span style="font-weight:400;color:var(--text3);font-size:10px"> (${oP}%)</span></td>`;
  });
  h+=`</tr></tbody></table></div></div></div></div>`;

  document.getElementById('app').innerHTML=h;
}

function renderKPI(){
  if(KPI.length<2){document.getElementById('app').innerHTML='<div class="state"><div class="ss">Sem dados em RECOVERS KPI.</div></div>';return;}
  const H=KPI[0];
  const allData=toObj(KPI);

  function pN(v){
    if(!v&&v!==0)return 0;
    const s=String(v).replace(/[€\s]/g,''); // remove € and all spaces first
    // Now either "56306,26" (PT) or "56306.26" (EN) or "56,306.26" (EN with comma thousands)
    // Detect: if comma exists and only 2 digits after last comma => decimal comma
    const commaIdx=s.lastIndexOf(',');
    const dotIdx=s.lastIndexOf('.');
    let normalized;
    if(commaIdx>dotIdx){
      // comma is decimal separator: remove dots (thousands), replace comma with dot
      normalized=s.replace(/\./g,'').replace(',','.');
    } else {
      // dot is decimal separator or no decimal at all: remove commas (thousands)
      normalized=s.replace(/,/g,'');
    }
    return parseFloat(normalized)||0;
  }
  function fmtEur(v){return v.toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
  function fmtPct(v){
    if(!v&&v!==0)return'—';
    const n=pN(v);
    // value might already be 0-100 or 0-1
    const pct=n>1?n:n*100;
    return pct.toFixed(0)+'%';
  }
  function hasDat(r){
    // row has data if any numeric column is non-zero
    return['rescisoes','equipamentos','recuperados','processo'].some(k=>{
      const col=Object.keys(r).find(h=>h.toLowerCase().includes(k.slice(0,5)));
      return col&&pN(r[col])>0;
    });
  }

  // Identify columns by keyword
  const mCol  = H.find(h=>/m[eê]s|month/i.test(h))||H[0];
  const cResc = H.find(h=>/rescis/i.test(h))||'';
  const cEquip= H.find(h=>/equipam/i.test(h))||'';
  const cRec  = H.find(h=>/recuperad/i.test(h))||'';
  const cProc = H.find(h=>/processo|em proc/i.test(h))||'';
  const cPct  = H.find(h=>/percent|recupera.*%|%/i.test(h))||'';
  const cVal  = H.find(h=>/valor|€|retid/i.test(h))||'';

  // Only rows with actual data + keep all 12 months for table
  const data12 = allData.filter(r=>(r[mCol]||'').trim());
  const dataWithValues = data12.filter(r=>cResc&&pN(r[cResc])>0);

  // Totals from data with values
  const totResc  = dataWithValues.reduce((s,r)=>s+pN(r[cResc]),0);
  const totEquip = dataWithValues.reduce((s,r)=>s+pN(r[cEquip]),0);
  const totRec   = dataWithValues.reduce((s,r)=>s+pN(r[cRec]),0);
  const totProc  = dataWithValues.reduce((s,r)=>s+pN(r[cProc]),0);
  const totVal   = dataWithValues.reduce((s,r)=>s+pN(r[cVal]),0);
  const avgPct   = totEquip>0?(totRec/totEquip*100):0;
  const mesesAtivos = dataWithValues.length;

  let h='<div class="fade">';

  // ── KPI CARDS ──
  h+=`<div class="sec"><div class="sec-lbl">Totais Acumulados ${new Date().getFullYear()} — ${mesesAtivos} ${mesesAtivos===1?'mês':'meses'} com dados</div>
  <div class="kpi-row">
    <div class="kpi b"><div class="kpi-lbl">Total Rescisões</div><div class="kpi-val">${totResc.toLocaleString('pt-PT')}</div><div class="kpi-sub">rescisões processadas</div></div>
    <div class="kpi p"><div class="kpi-lbl">Total Equipamentos</div><div class="kpi-val">${totEquip.toLocaleString('pt-PT')}</div><div class="kpi-sub">equipamentos em scope</div></div>
    <div class="kpi g"><div class="kpi-lbl">Recuperados</div><div class="kpi-val">${totRec.toLocaleString('pt-PT')}</div><div class="kpi-sub">equipamentos recuperados</div></div>
    <div class="kpi a"><div class="kpi-lbl">Em Processo</div><div class="kpi-val">${totProc.toLocaleString('pt-PT')}</div><div class="kpi-sub">ainda em acompanhamento</div></div>
    <div class="kpi ${avgPct>=80?'g':avgPct>=60?'a':'r'}"><div class="kpi-lbl">% Recuperação</div><div class="kpi-val">${avgPct.toFixed(0)}%</div><div class="kpi-sub">taxa global acumulada</div></div>
    ${cVal?`<div class="kpi g"><div class="kpi-lbl">Valor Retido</div><div class="kpi-val" style="font-size:20px">${fmtEur(totVal)}</div><div class="kki-sub" style="font-size:12px;color:var(--text3);margin-top:4px">valor total recuperado</div></div>`:''}
  </div></div><div class="div"></div>`;

  // ── CHARTS side by side ──
  const c1='ch1'+Date.now(), c2='ch2'+Date.now();
  h+=`<div class="sec"><div class="sec-lbl">Evolução Mensal</div>
  <div class="cols2">
    <div class="panel"><div class="ph"><span class="ph-title">Rescisões vs Recuperados vs Em Processo</span></div>
      <div style="padding:1rem;height:260px;position:relative"><canvas id="${c1}"></canvas></div></div>
    <div class="panel"><div class="ph"><span class="ph-title">Taxa de Recuperação (%)</span></div>
      <div style="padding:1rem;height:260px;position:relative"><canvas id="${c2}"></canvas></div></div>
  </div></div>`;

  setTimeout(()=>{
    if(CI){try{CI.destroy();}catch(e){}CI=null;}
    const activeRows=dataWithValues;
    const labels=activeRows.map(r=>(r[mCol]||'').replace(/^\d+\s*-\s*/,''));

    // Chart 1: bars
    const ctx1=document.getElementById(c1);
    if(ctx1){
      CI=new Chart(ctx1,{type:'bar',data:{labels,datasets:[
        {label:'Rescisões',data:activeRows.map(r=>pN(r[cResc])),backgroundColor:'#93c5fd',borderRadius:3},
        {label:'Recuperados',data:activeRows.map(r=>pN(r[cRec])),backgroundColor:'#86efac',borderRadius:3},
        {label:'Em Processo',data:activeRows.map(r=>pN(r[cProc])),backgroundColor:'#fcd34d',borderRadius:3},
      ]},options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{position:'top',labels:{font:{family:'DM Sans',size:11},boxWidth:10}}},
        scales:{x:{grid:{display:false},ticks:{font:{size:11},color:'#9c9b96'}},
                y:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:11},color:'#9c9b96'}}}}});
    }
    // Chart 2: % line
    const ctx2=document.getElementById(c2);
    if(ctx2){
      const pctData=activeRows.map(r=>{
        const v=pN(r[cPct]);
        return v>1?v:v*100;
      });
      new Chart(ctx2,{type:'line',data:{labels,datasets:[{
        label:'% Recuperação',data:pctData,
        borderColor:'#3b82f6',backgroundColor:'#3b82f620',
        borderWidth:2.5,pointRadius:4,pointBackgroundColor:'#3b82f6',tension:.3,fill:true
      }]},options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.parsed.y.toFixed(0)}%`}}},
        scales:{
          x:{grid:{display:false},ticks:{font:{size:11},color:'#9c9b96'}},
          y:{min:0,max:100,grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:11},color:'#9c9b96',callback:v=>v+'%'}}
        }}});
    }
  },80);

  // ── MONTHLY TABLE ──
  h+=`<div class="div"></div><div class="sec"><div class="sec-lbl">Tabela Mensal Detalhada</div>
  <div class="panel"><div class="tw"><table>
  <thead><tr>
    <th>Mês</th>
    ${cResc?`<th class="tr">Total Rescisões</th>`:''}
    ${cEquip?`<th class="tr">Total Equipamentos</th>`:''}
    ${cRec?`<th class="tr">Recuperados</th>`:''}
    ${cProc?`<th class="tr">Em Processo</th>`:''}
    ${cPct?`<th class="tr">% Recuperação</th>`:''}
    ${cVal?`<th class="tr">Valor Retido (€)</th>`:''}
  </tr></thead><tbody>`;

  data12.forEach(r=>{
    const mes=(r[mCol]||'').trim();
    if(!mes)return;
    const hasData=cResc&&pN(r[cResc])>0;
    const dimStyle=hasData?'':' style="color:var(--text3)"';
    const dash='<span style="color:var(--text3)">—</span>';
    const resc =cResc&&pN(r[cResc])>0  ?pN(r[cResc]).toLocaleString('pt-PT'):dash;
    const equip=cEquip&&pN(r[cEquip])>0?pN(r[cEquip]).toLocaleString('pt-PT'):dash;
    const rec  =cRec&&pN(r[cRec])>0   ?pN(r[cRec]).toLocaleString('pt-PT'):dash;
    const proc =cProc&&pN(r[cProc])>0 ?pN(r[cProc]).toLocaleString('pt-PT'):dash;
    const valR =cVal&&pN(r[cVal])>0   ?fmtEur(pN(r[cVal])):dash;

    // % badge
    let pctHtml=dash;
    if(cPct&&r[cPct]){
      const pv=pN(r[cPct]);const pct=pv>1?pv:pv*100;
      if(pct>0){
        const cls=pct>=80?'bg':pct>=60?'ba':'br';
        pctHtml=`<span class="badge ${cls}">${pct.toFixed(0)}%</span>`;
      }
    }

    h+=`<tr${dimStyle}><td><strong>${mes}</strong></td>
      ${cResc?`<td class="tr">${resc}</td>`:''}
      ${cEquip?`<td class="tr">${equip}</td>`:''}
      ${cRec?`<td class="tr" style="${hasData?'color:var(--green);font-weight:500':'color:var(--text3)'}">${rec}</td>`:''}
      ${cProc?`<td class="tr" style="${hasData?'color:var(--amber)':'color:var(--text3)'}">${proc}</td>`:''}
      ${cPct?`<td class="tr">${pctHtml}</td>`:''}
      ${cVal?`<td class="tr" style="${hasData?'font-weight:500':'color:var(--text3)'}">${valR}</td>`:''}
    </tr>`;
  });

  // Totals row
  h+=`<tr class="mt">
    <td>TOTAL / MÉDIA</td>
    ${cResc?`<td class="tr">${totResc.toLocaleString('pt-PT')}</td>`:''}
    ${cEquip?`<td class="tr">${totEquip.toLocaleString('pt-PT')}</td>`:''}
    ${cRec?`<td class="tr" style="color:var(--green)">${totRec.toLocaleString('pt-PT')}</td>`:''}
    ${cProc?`<td class="tr" style="color:var(--amber)">${totProc.toLocaleString('pt-PT')}</td>`:''}
    ${cPct?`<td class="tr"><span class="badge ${avgPct>=80?'bg':avgPct>=60?'ba':'br'}">${avgPct.toFixed(0)}%</span></td>`:''}
    ${cVal?`<td class="tr">${fmtEur(totVal)}</td>`:''}
  </tr>`;
  h+=`</tbody></table></div></div></div></div>`;

  document.getElementById('app').innerHTML=h;
}

init();
</script>
</body>
</html>
